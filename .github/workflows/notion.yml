name: Fetch Notion Insights

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch Notion data
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python scripts/fetch_notion.py

      - name: Commit and push insights.json
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          # 🔥 vigtig: hent ALT før vi gør noget
          git fetch origin main

          # 🔥 rebase + autostash (løser conflicts)
          git rebase --autostash origin/main

          git add insights.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update insights"

          # 🔥 push direkte til main
          git push origin HEAD:main