<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Blue Trampoline – Insights</title>
  <meta name="description" content="Blue Trampoline helps technically driven businesses turn uncertainty into focused action and new business opportunities.">

  <link rel="icon" type="image/png" href="/assets/favicon.jpeg">
  <link rel="icon" type="image/svg+xml" href="/assets/Icon1.svg">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="/css/style.css?v=2">
</head>

<body>

<div id="navbar"></div>

<main>
  <section class="section">
    <div class="container">

      <h1 class="title" data-aos="fade-up">Insights</h1>

      <p class="lead-text" data-aos="fade-up" data-aos-delay="100">
        A place to explore development and curiosity with Thoughts, Methods, iCases and Talks.
      </p>

      <div class="row g-3 mb-4" data-aos="fade-up" data-aos-delay="150">

        <div class="col-12">
          <input id="searchInput" class="form-control" type="search" placeholder="Search insights...">
        </div>

        <div class="col-12 col-md-6">
          <select id="topicFilter" class="form-select">
            <option value="all">All topics</option>
          </select>
        </div>

        <div class="col-12 col-md-6">
          <select id="focusFilter" class="form-select">
            <option value="all">All focus</option>
          </select>
        </div>

      </div>

      <div class="row g-4" id="insightsContainer"></div>

    </div>
  </section>
</main>

<script>
  fetch("/insights/navbar.html")
    .then(response => response.text())
    .then(html => {
      document.getElementById("navbar").innerHTML = html;

      const navbar = document.querySelector(".insight-navbar");
      const logo = navbar.querySelector(".insight-logo");

      function updateInsightNavbar() {
        const scroll = window.scrollY;

        /* LOGO
           Starter med det samme.
           Er helt zoomet ud efter 90 px.
        */
        const logoProgress = Math.min(Math.max(scroll / 90, 0), 1);

        const scale = 2.45 - (1.45 * logoProgress);
        const x = -15 + (15 * logoProgress);
        const y = 15 - (15 * logoProgress);

        logo.style.transform =
          `scale(${scale}) translate(${x}%, ${y}%)`;


        /* NAVBAR
           Starter først efter logoet ved 90 px.
           Er helt hvid ved 140 px.
        */
        const navProgress =
          Math.min(Math.max((scroll - 90) / 50, 0), 1);

        const bgR = Math.round(22 + (251 - 22) * navProgress);
        const bgG = Math.round(58 + (250 - 58) * navProgress);
        const bgB = Math.round(95 + (248 - 95) * navProgress);

        const textR = Math.round(251 + (22 - 251) * navProgress);
        const textG = Math.round(250 + (58 - 250) * navProgress);
        const textB = Math.round(248 + (95 - 248) * navProgress);

        navbar.style.backgroundColor =
          `rgb(${bgR}, ${bgG}, ${bgB})`;

        navbar.style.setProperty(
          "--insight-nav-color",
          `rgb(${textR}, ${textG}, ${textB})`
        );

        navbar.style.borderBottomColor =
          `rgba(46,49,53,${0.08 * navProgress})`;

        navbar.style.boxShadow =
          `0 4px 18px rgba(46,49,53,${0.06 * navProgress})`;
      }

      window.addEventListener("scroll", updateInsightNavbar, {
        passive: true
      });

      updateInsightNavbar();
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/insights.js"></script>
<script>
  if (typeof AOS !== "undefined") {
    AOS.init({ duration: 700, once: true });
  }
</script>
