<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Blue Trampoline – Insights</title>
  <meta name="description" content="Blue Trampoline helps technically driven businesses turn uncertainty into focused action and new business opportunities.">

  <link rel="icon" type="image/png" href="/assets/favicon.jpeg">
  <link rel="icon" type="image/svg+xml" href="/assets/Icon1.svg">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="/css/style.css?v=3">
</head>

<body>

<div id="navbar"></div>

<main>
  <section class="section">
    <div class="container">

      <h1 class="title" data-aos="fade-up">Insights</h1>

      <p class="lead-text" data-aos="fade-up" data-aos-delay="100">
        A place to explore development and curiosity with Thoughts, Methods, iCases and Talks.
      </p>

      <div class="row g-3 mb-4" data-aos="fade-up" data-aos-delay="150">

        <div class="col-12">
          <input id="searchInput" class="form-control" type="search" placeholder="Search insights...">
        </div>

        <div class="col-12 col-md-6">
          <select id="topicFilter" class="form-select">
            <option value="all">All topics</option>
          </select>
        </div>

        <div class="col-12 col-md-6">
          <select id="focusFilter" class="form-select">
            <option value="all">All focus</option>
          </select>
        </div>

      </div>

      <div class="row g-4" id="insightsContainer"></div>

    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script src="/js/insights.js"></script>

<script>
  fetch("/insights/navbar.html")
    .then(response => response.text())
    .then(html => {
      document.getElementById("navbar").innerHTML = html;
      window.initInsightNavbar();
    });
</script>

<script>
  if (typeof AOS !== "undefined") {
    AOS.init({
      duration: 700,
      once: true
    });
  }
</script>

<footer class="site-footer">
  <div class="container footer-main">
    <div class="footer-cta">

      <h2>Har du noget, der er vigtigt,<br>men endnu ikke helt klart?</h2>

      <p>Lad os tage en kaffe.</p>

    </div>

    <div class="footer-contact-block">
      <a href="mailto:hello@bluetrampoline.com" class="footer-button">Let’s talk</a>
    </div>

  </div>

  <div class="container footer-meta">

    © 2026 Blue Trampoline | CVR 38284037 | <i class="bi bi-geo-alt"></i> Esbjerg, Danmark |

    <a href="https://www.linkedin.com/company/blue-trampoline/" target="_blank" rel="noopener noreferrer" class="footer-linkedin">
      <i class="bi bi-linkedin" style="color:var(--white);"></i>
    </a>

  </div>
</footer>

</body>
</html>
